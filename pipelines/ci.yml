trigger:
  batch: true
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  AWS_REGION: 'us-east-1'
  ECR_REGISTRY: '$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com'
  ECR_REPOSITORY: 'ecommerce'
  javaVersion: '21'
  nodeVersion: '20'

stages:
  - stage: Build
    displayName: 'Build, Test & Validate'
    jobs:
      - job: BackendTests
        displayName: 'Build & Test Backend'
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: 'Set up Java 21'
            inputs:
              versionSpec: '$(javaVersion)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
              chmod +x linux-install.sh
              sudo ./linux-install.sh
            displayName: 'Install Clojure CLI'

          - task: Cache@2
            displayName: 'Cache Maven dependencies'
            inputs:
              key: 'maven | "$(Agent.OS)" | deps.edn'
              restoreKeys: 'maven | "$(Agent.OS)"'
              path: '$(HOME)/.m2/repository'

          - script: clojure -M:test -m kaocha.runner --plugin cloverage --cov-output target/coverage
            displayName: 'Run tests with coverage'

          - script: |
              python3 << 'PYEOF'
              import xml.etree.ElementTree as ET, time
              root = ET.parse("target/coverage/coverage.xml").getroot()
              pkgs_el = ET.Element("packages")
              total_lines = total_covered = 0
              for pkg in root.findall(".//package"):
                  name = pkg.get("name")
                  for cov in pkg.findall("coverage"):
                      if cov.get("type","").startswith("line"):
                          val = cov.get("value","0% (0/0)")
                          nums = val.split("(")[1].rstrip(")").split("/")
                          covered, total = int(nums[0]), int(nums[1])
                          rate = covered/total if total else 0
                          total_lines += total; total_covered += covered
                          p = ET.SubElement(pkgs_el, "package", name=name, **{"line-rate": f"{rate:.4f}", "branch-rate": "0", "complexity": "0"})
                          cls = ET.SubElement(ET.SubElement(p, "classes"), "class", name=name, filename=name.replace(".","/") + ".clj", **{"line-rate": f"{rate:.4f}", "branch-rate": "0"})
                          lines = ET.SubElement(cls, "lines")
                          for i in range(1, total+1):
                              ET.SubElement(lines, "line", number=str(i), hits="1" if i <= covered else "0")
              overall = total_covered/total_lines if total_lines else 0
              cob = ET.Element("coverage", version="1", timestamp=str(int(time.time())), **{"lines-valid": str(total_lines), "lines-covered": str(total_covered), "line-rate": f"{overall:.4f}", "branches-valid": "0", "branches-covered": "0", "branch-rate": "0", "complexity": "0"})
              cob.append(pkgs_el)
              ET.ElementTree(cob).write("target/coverage/cobertura.xml", xml_declaration=True, encoding="UTF-8")
              print(f"Generated cobertura.xml: {total_covered}/{total_lines} lines ({overall:.1%})")
              PYEOF
            displayName: 'Convert coverage to Cobertura XML'

          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/coverage"
              cp -r target/coverage/* "$(Build.ArtifactStagingDirectory)/coverage/"
            displayName: 'Collect backend coverage'

          - publish: $(Build.ArtifactStagingDirectory)/coverage
            artifact: coverage-backend
            displayName: 'Publish backend coverage artifact'

      - job: FrontendTests
        displayName: 'Build & Test Frontend'
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: 'Set up Java 21'
            inputs:
              versionSpec: '$(javaVersion)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: NodeTool@0
            displayName: 'Set up Node.js'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: |
              curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
              chmod +x linux-install.sh
              sudo ./linux-install.sh
            displayName: 'Install Clojure CLI'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx shadow-cljs compile test && node out/test/test.js
            displayName: 'Run frontend tests'

      - job: TerraformValidate
        displayName: 'Validate Terraform'
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -euo pipefail
              TERRAFORM_VERSION="1.11.4"
              curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
              rm /tmp/terraform.zip
              terraform --version
            displayName: 'Install Terraform'

          - script: terraform fmt -check -recursive infra/
            displayName: 'Terraform fmt check'

          - script: |
              set -euo pipefail
              cd infra

              cat > _ci_override.tf << 'OVERRIDE'
              terraform {
                backend "local" {}
              }
              OVERRIDE

              terraform init -input=false 2>&1 | tail -1
              terraform validate
              rm -f _ci_override.tf
            displayName: 'Terraform validate'

      - job: DockerBuild
        displayName: 'Build Docker Image'
        steps:
          - checkout: self

          - script: |
              docker build \
                -t $(ECR_REGISTRY)/$(ECR_REPOSITORY):$(Build.BuildId) \
                -t $(ECR_REGISTRY)/$(ECR_REPOSITORY):latest \
                .
            displayName: 'Build Docker image'

          - script: |
              docker save \
                $(ECR_REGISTRY)/$(ECR_REPOSITORY):$(Build.BuildId) \
                $(ECR_REGISTRY)/$(ECR_REPOSITORY):latest \
                -o $(Build.ArtifactStagingDirectory)/app-image.tar
            displayName: 'Save Docker image'

          - publish: $(Build.ArtifactStagingDirectory)/app-image.tar
            artifact: app-image
            displayName: 'Publish Docker artifact'

      - job: CoverageReport
        displayName: 'Coverage Report'
        dependsOn:
          - BackendTests
        condition: succeededOrFailed()
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download backend coverage'
            inputs:
              artifactName: 'coverage-backend'
              targetPath: '$(Pipeline.Workspace)/coverage/backend'
            continueOnError: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            inputs:
              summaryFileLocation: '$(Pipeline.Workspace)/coverage/backend/cobertura.xml'
            continueOnError: true

  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: TerraformApply
        displayName: 'Terraform Apply'
        steps:
          - checkout: self

          - script: |
              set -euo pipefail
              if ! command -v terraform &> /dev/null; then
                TERRAFORM_VERSION="1.11.4"
                curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
                sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
                rm /tmp/terraform.zip
              fi
              terraform --version
            displayName: 'Install Terraform'

          - script: |
              set -euo pipefail
              cd infra

              echo "##[group]Terraform Init"
              terraform init -input=false -reconfigure
              echo "##[endgroup]"

              echo "##[group]Terraform Plan"
              terraform plan -input=false -out=tfplan
              echo "##[endgroup]"

              echo "##[group]Terraform Apply"
              terraform apply -input=false -auto-approve tfplan
              echo "##[endgroup]"

              echo "Terraform apply completed successfully."
            displayName: 'Terraform Init + Plan + Apply'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)
              TF_VAR_db_password: $(TF_VAR_DB_PASSWORD)
              TF_VAR_key_pair_name: $(TF_VAR_KEY_PAIR_NAME)
              TF_VAR_ecr_registry: $(ECR_REGISTRY)

      - job: DeployApp
        displayName: 'Deploy App'
        dependsOn: TerraformApply
        steps:
          - download: current
            artifact: app-image
            displayName: 'Download Docker artifact'

          - script: |
              docker load -i $(Pipeline.Workspace)/app-image/app-image.tar
            displayName: 'Load Docker image'

          - script: |
              aws ecr get-login-password --region $(AWS_REGION) | \
                docker login --username AWS --password-stdin $(ECR_REGISTRY)
            displayName: 'Login to ECR'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)

          - script: |
              docker push $(ECR_REGISTRY)/$(ECR_REPOSITORY):$(Build.BuildId)
              docker push $(ECR_REGISTRY)/$(ECR_REPOSITORY):latest
            displayName: 'Push to ECR'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)

          - script: |
              set -euo pipefail
              INSTANCE_ID=$(aws ec2 describe-instances \
                --filters "Name=tag:Name,Values=ecommerce-app" "Name=instance-state-name,Values=running" \
                --query "Reservations[0].Instances[0].InstanceId" \
                --output text \
                --region $(AWS_REGION))

              echo "Deploying to instance: $INSTANCE_ID"

              COMMAND_ID=$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters 'commands=["cd /opt/ecommerce && /opt/ecommerce/ecr-login.sh && docker compose pull app && docker compose up -d"]' \
                --region $(AWS_REGION) \
                --query "Command.CommandId" \
                --output text)

              echo "SSM Command ID: $COMMAND_ID"

              aws ssm wait command-executed \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region $(AWS_REGION) 2>/dev/null || true

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region $(AWS_REGION) \
                --query "Status" \
                --output text)

              echo "Command status: $STATUS"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region $(AWS_REGION) \
                --query "StandardOutputContent" \
                --output text

              if [ "$STATUS" != "Success" ]; then
                echo "##[error]Deploy failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region $(AWS_REGION) \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
              fi
            displayName: 'Deploy to EC2 via SSM'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)
