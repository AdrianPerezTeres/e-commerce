trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

variables:
  dockerRegistry: 'ghcr.io'
  imageName: 'ecommerce'
  javaVersion: '21'
  nodeVersion: '20'

stages:
  - stage: Test
    displayName: 'Run Tests'
    jobs:
      - job: BackendTests
        displayName: 'Backend Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Set up Java 21'
            inputs:
              versionSpec: '$(javaVersion)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
              chmod +x linux-install.sh
              sudo ./linux-install.sh
            displayName: 'Install Clojure CLI'

          - task: Cache@2
            displayName: 'Cache Maven dependencies'
            inputs:
              key: 'maven | "$(Agent.OS)" | deps.edn'
              restoreKeys: 'maven | "$(Agent.OS)"'
              path: '$(HOME)/.m2/repository'

          - script: clojure -M:test -m kaocha.runner --plugin cloverage --cov-output target/coverage
            displayName: 'Run tests with coverage'

          - task: PublishBuildArtifacts@1
            displayName: 'Upload coverage report'
            condition: always()
            inputs:
              pathToPublish: 'target/coverage'
              artifactName: 'coverage-report'

      - job: FrontendTests
        displayName: 'Frontend Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Set up Java 21'
            inputs:
              versionSpec: '$(javaVersion)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: NodeTool@0
            displayName: 'Set up Node.js'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx shadow-cljs compile test && node out/test/test.js
            displayName: 'Run frontend tests'

  - stage: Build
    displayName: 'Build Docker Image'
    dependsOn: Test
    jobs:
      - job: DockerBuild
        displayName: 'Docker Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: 'build'
              Dockerfile: 'Dockerfile'
              buildContext: '.'
              tags: '$(Build.SourceVersion)'

  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToEC2
        displayName: 'Deploy to EC2'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Docker@2
                  displayName: 'Login to container registry'
                  inputs:
                    command: 'login'
                    containerRegistry: '$(dockerRegistry)'

                - task: Docker@2
                  displayName: 'Build and push image'
                  inputs:
                    command: 'buildAndPush'
                    Dockerfile: 'Dockerfile'
                    buildContext: '.'
                    repository: '$(dockerRegistry)/$(imageName)'
                    tags: 'latest'

                - task: SSH@0
                  displayName: 'Deploy to EC2'
                  inputs:
                    sshEndpoint: 'EC2-Production'
                    runOptions: 'inline'
                    inline: |
                      cd /opt/ecommerce
                      docker-compose pull app
                      docker-compose up -d
